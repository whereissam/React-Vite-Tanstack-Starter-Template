version: 2
updates:
  # `bun`, not `npm`: this repo locks with bun.lock, and the npm ecosystem
  # only rewrites package.json — leaving the lockfile stale so CI fails at
  # `bun install --frozen-lockfile`.
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint pins `typescript >=4.8.4 <6.1.0`; TS 7 crashes
      # `bun run lint`. Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
